<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة تحكم الفريق المفصلة | Shark Tank Youth</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    
    body {
      background: #070b19;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.15);
      text-align: center;
      margin-bottom: 16px;
    }

    h2 { color: #00f2fe; margin-bottom: 6px; font-weight: 900; }
    p.desc { color: #94a3b8; font-size: 0.88rem; margin-bottom: 16px; }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      outline: none;
    }
    select option { background: #0f172a; color: #fff; }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #070b19;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.97); }

    .wallet-card {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.05));
      border: 2px solid #00f2fe;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .wallet-title { font-size: 0.85rem; color: #cbd5e1; font-weight: 700; }
    .wallet-balance { font-size: 2.2rem; font-weight: 900; color: #00f2fe; text-shadow: 0 0 15px rgba(0, 242, 254, 0.6); margin-top: 4px; }

    .history-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: right;
      max-height: 120px;
      overflow-y: auto;
    }
    .history-title { font-size: 0.82rem; color: #94a3b8; font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
    .history-item { font-size: 0.78rem; color: #e2e8f0; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .history-item span.gain { color: #2ecc71; font-weight: bold; }
    .history-item span.spend { color: #ff0844; font-weight: bold; }

    /* تبويبات المواسم الأربعة */
    .tab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: none;
    }
    .tab-btn.active {
      background: rgba(0, 242, 254, 0.2);
      border-color: #00f2fe;
      color: #00f2fe;
    }

    /* جدول الـ 12 أسبوعاً */
    .weeks-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      text-align: right;
      max-height: 350px;
      overflow-y: auto;
      padding-left: 4px;
    }
    .week-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
    .week-row.booked {
      border-color: rgba(0, 242, 254, 0.4);
      background: rgba(0, 242, 254, 0.06);
    }
    .week-title { font-weight: 900; color: #38bdf8; min-width: 85px; }
    .week-content { flex: 1; margin: 0 8px; color: #f1f5f9; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .week-content.empty { color: #64748b; font-style: italic; }
    .week-cost { font-weight: 900; color: #f1c40f; }

    .section-title {
      font-size: 0.9rem;
      font-weight: 900;
      color: #38bdf8;
      margin: 12px 0 8px 0;
      text-align: right;
      border-right: 3px solid #00f2fe;
      padding-right: 8px;
    }

    .msg { margin-top: 10px; font-weight: 700; font-size: 0.85rem; display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. تسجيل الدخول -->
    <div class="card" id="loginScreen">
      <h2>🚩 دخول الفريق</h2>
      <p class="desc">اختر اسم فريقك وأدخل كلمة السر لعرض تفاصيل الخطة الأسبوعية</p>

      <select id="teamSelect">
        <option value="" disabled selected>-- اختر الفريق --</option>
        <option value="team_virgin_mary">فريق السيدة العذراء</option>
        <option value="team_archangel_michael">فريق الملاك ميخائيل</option>
        <option value="team_st_mercurius">فريق القديس ابو سيفين</option>
        <option value="team_anba_rois">فريق الانبا رويس</option>
      </select>

      <input type="password" id="teamPassInput" placeholder="كلمة السر الخاصة بالفريق...">
      <button onclick="loginTeam()">دخول لوحة الفريق ↵</button>
      <div id="loginError" class="msg" style="color: #ff0844;">❌ كلمة السر غير صحيحة!</div>
    </div>

    <!-- 2. لوحة المتابعة المفصلة -->
    <div id="dashboardScreen" class="hidden">
      
      <div class="wallet-card">
        <div class="wallet-title" id="teamNameHeader">محفظة الفريق</div>
        <div class="wallet-balance" id="teamBalanceDisplay">0 ج.ك</div>
      </div>

      <div class="history-box">
        <div class="history-title">📜 سجل الحركات المالية المباشرة:</div>
        <div id="transactionsList">
          <div style="color: #64748b; font-size: 0.8rem; text-align: center;">لا توجد معاملات حتى الآن</div>
        </div>
      </div>

      <div class="card" style="padding: 14px;">
        <h3 style="color: #00f2fe; font-size: 1.05rem; margin-bottom: 12px; font-weight: 900;">📋 جدول الموسم التنفيذي (12 أسبوعاً)</h3>
        
        <!-- أزرار التبديل بين المواسم -->
        <div class="tab-nav">
          <button class="tab-btn active" onclick="switchQuarterTab('Q1')">🍂 Q1 الخريف</button>
          <button class="tab-btn" onclick="switchQuarterTab('Q2')">❄️ Q2 الشتاء</button>
          <button class="tab-btn" onclick="switchQuarterTab('Q3')">🌱 Q3 الربيع</button>
          <button class="tab-btn" onclick="switchQuarterTab('Q4')">☀️ Q4 الصيف</button>
        </div>

        <!-- أ. جدول الـ 12 أسبوعاً للمتكلمين -->
        <div class="section-title">🎙️ المتكلمون (مطلوب تغطية 12 أسبوعاً): <span id="speakersCountBadge" style="color:#00f2fe; font-size:0.8rem;">(0/12)</span></div>
        <div class="weeks-container" id="speakersWeeksGrid">
          <!-- تتولد الـ 12 أسبوعاً هنا -->
        </div>

        <!-- ب. الرحلات الثلاث والهدايا والأنشطة -->
        <div class="section-title">🚌 الرحلات والفعاليات والهدايا:</div>
        <div class="weeks-container" id="eventsGrid">
          <!-- تتولد الرحلات والفعاليات هنا -->
        </div>

      </div>

    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCuaEafr-MAWy9U85XGN-tyNf-x5cn1JeM",
      authDomain: "maze-d8572.firebaseapp.com",
      databaseURL: "https://maze-d8572-default-rtdb.firebaseio.com",
      projectId: "maze-d8572",
      storageBucket: "maze-d8572.firebasestorage.app",
      messagingSenderId: "133228040813",
      appId: "1:133228040813:web:67eac572b15f952e99e564"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const teamPasswords = {
      "team_virgin_mary": "mary1212",
      "team_archangel_michael": "mike2019",
      "team_st_mercurius": "phil2222",
      "team_anba_rois": "rois7123"
    };

    let currentTeamKey = "";
    let activeQuarter = "Q1";
    let cachedTeamData = null;

    function loginTeam() {
      const select = document.getElementById("teamSelect");
      const pass = document.getElementById("teamPassInput").value.trim().toLowerCase();
      const teamKey = select.value;
      const errorEl = document.getElementById("loginError");

      if (!teamKey || teamPasswords[teamKey] !== pass) {
        errorEl.style.display = "block";
        return;
      }

      errorEl.style.display = "none";
      currentTeamKey = teamKey;
      const teamName = select.options[select.selectedIndex].text;
      document.getElementById("teamNameHeader").textContent = `محفظة ${teamName}`;

      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("dashboardScreen").classList.remove("hidden");

      listenToTeamData();
    }

    function switchQuarterTab(qId) {
      activeQuarter = qId;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['Q1', 'Q2', 'Q3', 'Q4'][idx] === qId);
      });
      if (cachedTeamData) {
        renderQuarterDetails();
      }
    }

    function listenToTeamData() {
      db.ref('teams/' + currentTeamKey).on('value', snapshot => {
        cachedTeamData = snapshot.val() || {};
        
        // 1. تحديث الرصيد
        const balance = Number(cachedTeamData.balance || 0);
        document.getElementById("teamBalanceDisplay").textContent = balance.toLocaleString() + " ج.ك";

        // 2. تحديث سجل الحركات
        const txContainer = document.getElementById("transactionsList");
        txContainer.innerHTML = "";
        
        let allTransactions = [];
        if (cachedTeamData.investments) {
          cachedTeamData.investments.forEach(inv => {
            allTransactions.push({ text: `استثمار من الشارك: ${inv.shark_name}`, amount: `+${Number(inv.amount).toLocaleString()} ج.ك`, type: 'gain', time: inv.time });
          });
        }
        if (cachedTeamData.purchases) {
          cachedTeamData.purchases.forEach(pur => {
            allTransactions.push({ text: `شراء: ${pur.item_name} (${pur.quarter})`, amount: `-${Number(pur.cost).toLocaleString()} ج.ك`, type: 'spend', time: pur.time });
          });
        }

        if (allTransactions.length === 0) {
          txContainer.innerHTML = '<div style="color: #64748b; font-size: 0.8rem; text-align: center;">لا توجد معاملات حتى الآن</div>';
        } else {
          allTransactions.reverse().forEach(tx => {
            const div = document.createElement("div");
            div.className = "history-item";
            div.innerHTML = `<span>${tx.text} <small style="color:#94a3b8;">(${tx.time})</small></span><span class="${tx.type}">${tx.amount}</span>`;
            txContainer.appendChild(div);
          });
        }

        // 3. بناء الجدول الأسبوعي
        renderQuarterDetails();
      });
    }

    function renderQuarterDetails() {
      const qPlan = (cachedTeamData.plan && cachedTeamData.plan[activeQuarter]) || [];
      const speakersGrid = document.getElementById("speakersWeeksGrid");
      const eventsGrid = document.getElementById("eventsGrid");
      
      speakersGrid.innerHTML = "";
      eventsGrid.innerHTML = "";

      let bookedSpeakersCount = 0;

      // أ. بناء الـ 12 أسبوعاً للمتكلمين واحداً تلو الآخر
      for (let i = 1; i <= 12; i++) {
        const slotKey = `الأسبوع (${i})`;
        const found = qPlan.find(item => item.slot === slotKey || (item.name && item.name.includes(slotKey)));

        const row = document.createElement("div");
        row.className = `week-row ${found ? 'booked' : ''}`;

        if (found) {
          bookedSpeakersCount++;
          // استخراج اسم البند بدون رمز الأسبوع المكرر
          const cleanName = found.name.replace(/^الأسبوع \(\d+\)\s*:\s*/, '');
          row.innerHTML = `
            <div class="week-title">📅 أسبوع ${i}</div>
            <div class="week-content" title="${cleanName}">${cleanName}</div>
            <div class="week-cost">${Number(found.cost).toLocaleString()} ج.ك</div>
          `;
        } else {
          row.innerHTML = `
            <div class="week-title" style="color:#64748b;">📅 أسبوع ${i}</div>
            <div class="week-content empty">❌ شاغر لم يُحجز بعد</div>
            <div class="week-cost" style="color:#64748b;">-</div>
          `;
        }
        speakersGrid.appendChild(row);
      }

      document.getElementById("speakersCountBadge").textContent = `(${bookedSpeakersCount}/12 أسبوعاً)`;

      // ب. بناء الرحلات والهدايا والفعاليات
      const nonSpeakerItems = qPlan.filter(item => !(item.slot && item.slot.startsWith("الأسبوع (")));
      
      if (nonSpeakerItems.length === 0) {
        eventsGrid.innerHTML = '<div style="color: #64748b; font-size: 0.8rem; text-align: center; padding: 10px;">لا توجد رحلات أو فعاليات مشتراة لهذا الموسم حتى الآن</div>';
      } else {
        nonSpeakerItems.forEach(item => {
          const row = document.createElement("div");
          row.className = "week-row booked";
          row.innerHTML = `
            <div class="week-title" style="color:#a855f7;">${item.slot || 'فعالية'}</div>
            <div class="week-content" title="${item.name}">${item.name}</div>
            <div class="week-cost">${Number(item.cost).toLocaleString()} ج.ك</div>
          `;
          eventsGrid.appendChild(row);
        });
      }
    }
  </script>
</body>
</html>
