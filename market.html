<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سوق تعاقدات الخدمة | Ministry Market</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    
    body {
      background: #070b19;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.15);
      text-align: center;
      margin-bottom: 16px;
    }

    h2 { color: #00f2fe; margin-bottom: 6px; font-weight: 900; }
    p.desc { color: #94a3b8; font-size: 0.88rem; margin-bottom: 18px; }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      outline: none;
    }
    select option { background: #0f172a; color: #fff; }
    input:focus, select:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }

    .desk-badge {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      display: inline-block;
      margin-bottom: 12px;
    }

    /* شبكة مربعات الكتالوج */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 16px;
      text-align: right;
    }

    .item-square {
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(0, 242, 254, 0.2);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .item-square:hover {
      border-color: #00f2fe;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.15);
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: 900;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .item-info {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .item-price-tag {
      font-size: 1.1rem;
      font-weight: 900;
      color: #00f2fe;
      margin-bottom: 10px;
      text-align: left;
      direction: ltr;
    }

    .btn-buy {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #070b19;
      transition: transform 0.2s;
    }
    .btn-buy:active { transform: scale(0.96); }

    .msg { margin-top: 12px; font-weight: 700; font-size: 0.9rem; display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. شاشة تسجيل الدخول -->
    <div class="card-box" id="loginScreen">
      <h2>🏪 سوق تعاقدات الخدمة</h2>
      <p class="desc">اختر مكتب التعاقدات المسؤول عنه وأدخل كلمة السر المخصصة</p>

      <select id="deskSelect">
        <option value="" disabled selected>-- اختر مكتب التعاقد --</option>
        <option value="speakers">🎙️ مكتب المتكلمين (مطلوب 12 أسبوعاً للربع)</option>
        <option value="trips">🚌 مكتب الرحلات وأتوبيسات الخلوة السنوية</option>
        <option value="events">🎁 مكتب الهدايا والاحتفالات والأنشطة</option>
      </select>

      <input type="password" id="servantPassInput" placeholder="كلمة سر المكتب (speak101 / trip202 / event303)...">
      <button class="btn-buy" style="padding: 13px;" onclick="loginServant()">دخول المكتب ↵</button>
      <div id="loginError" class="msg" style="color: #ff0844;">❌ كلمة السر غير صحيحة لهذا المكتب!</div>
    </div>

    <!-- 2. شاشة الشراء المباشر بالأسبوع والمربعات -->
    <div id="marketScreen" class="hidden">
      
      <div class="card-box" style="margin-bottom: 14px;">
        <div class="desk-badge" id="deskTitleDisplay">المكتب</div>
        <h2 style="font-size: 1.25rem;">إتمام تعاقد فردي مفصل</h2>
        <p class="desc" style="margin-bottom: 14px;">حدد الفريق والموسم ورقم الأسبوع/الشهر، ثم اختر البند للشراء</p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <div style="text-align: right; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 4px;">١. الفريق:</div>
            <select id="teamTargetSelect">
              <option value="" disabled selected>-- اختر الفريق --</option>
              <option value="team_virgin_mary">فريق السيدة العذراء</option>
              <option value="team_archangel_michael">فريق الملاك ميخائيل</option>
              <option value="team_st_mercurius">فريق القديس ابو سيفين</option>
              <option value="team_anba_rois">فريق الانبا رويس</option>
            </select>
          </div>

          <div>
            <div style="text-align: right; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 4px;">٢. الربع السنوي:</div>
            <select id="quarterTargetSelect">
              <option value="Q1">الربع الأول (Q1 - الخريف)</option>
              <option value="Q2">الربع الثاني (Q2 - الشتاء)</option>
              <option value="Q3">الربع الثالث (Q3 - الربيع)</option>
              <option value="Q4">الربع الرابع (Q4 - الصيف)</option>
            </select>
          </div>
        </div>

        <div style="text-align: right; font-size: 0.8rem; color: #cbd5e1; margin-top: 6px; margin-bottom: 4px;">٣. التوقيت المستهدف (أسبوع / شهر):</div>
        <select id="slotTargetSelect">
          <!-- يتغير ديناميكياً حسب نوع المكتب -->
        </select>

        <div id="saleStatus" class="msg"></div>
      </div>

      <!-- شبكة المربعات -->
      <div class="market-grid" id="itemsGrid"></div>

    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCuaEafr-MAWy9U85XGN-tyNf-x5cn1JeM",
      authDomain: "maze-d8572.firebaseapp.com",
      databaseURL: "https://maze-d8572-default-rtdb.firebaseio.com",
      projectId: "maze-d8572",
      storageBucket: "maze-d8572.firebasestorage.app",
      messagingSenderId: "133228040813",
      appId: "1:133228040813:web:67eac572b15f952e99e564"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const deskPasswords = {
      "speakers": "speak101",
      "trips": "trip202",
      "events": "event303"
    };

    // كتالوج فردي بالكامل بدون باندلز
    const marketCatalog = {
      speakers: [
        { name: "خادم محلي / أمين الخدمة", info: "خادم من أسرة المرحلة لموضوع محلي", cost: 0 },
        { name: "كاهن من الكنيسة أو الإيبارشية", info: "محاضرة طقسية وعقائدية متخصصة", cost: 2500 },
        { name: "خادم شباب وميديا معروف", info: "لقاء شبابي وترانيم وميديا هادفة", cost: 5000 },
        { name: "متخصص نفسي وتربوي مشهور", info: "ندوة علاقات وتعديل سلوك وصحة نفسية", cost: 8000 },
        { name: "متكلم VIP قامة كنسية كبيرة", info: "لقاء قامة كنسية كبيرة (د. مجدي / أبونا داود)", cost: 12000 }
      ],
      trips: [
        { name: "رحلة قريبة (مارمينا/النطرون) - عادي 28", info: "أتوبيس عادي بدون تكييف سعة 28 راكب", cost: 4000 },
        { name: "رحلة قريبة (مارمينا/النطرون) - مكيف 28", info: "ميني باص مكيف سياحي سعة 28 راكب", cost: 6500 },
        { name: "رحلة قريبة (مارمينا/النطرون) - سياحي 50", info: "أتوبيس مرسيدس سياحي مكيف 50 راكب", cost: 10000 },
        { name: "رحلة متوسطة (الخطاطبة/مقار) - عادي 28", info: "أتوبيس عادي سعة 28 راكب", cost: 6000 },
        { name: "رحلة متوسطة (الخطاطبة/مقار) - مكيف 28", info: "ميني باص مكيف سعة 28 راكب", cost: 9500 },
        { name: "رحلة متوسطة (الخطاطبة/مقار) - سياحي 50", info: "أتوبيس سياحي مكيف كبير سعة 50 راكب", cost: 14000 },
        { name: "رحلة بعيدة (القاهرة/بورسعيد/البحر الأحمر) - عادي 28", info: "أتوبيس 28 راكب للمسافات الطويلة", cost: 9000 },
        { name: "رحلة بعيدة (القاهرة/بورسعيد/البحر الأحمر) - مكيف 28", info: "ميني باص مكيف 28 راكب", cost: 14000 },
        { name: "رحلة بعيدة (القاهرة/بورسعيد/البحر الأحمر) - سياحي 50", info: "أتوبيس سياحي فاخر 50 راكب", cost: 22000 },
        { name: "رحلة بعيدة جداً (أديرة الصعيد/الأقصر) - مكيف 28", info: "ميني باص مكيف حديث للسفر الطويل", cost: 22000 },
        { name: "رحلة بعيدة جداً (أديرة الصعيد/الأقصر) - سياحي 50", info: "أتوبيس سياحي VIP سعة 50 راكب", cost: 35000 },
        { name: "الخلوة السنوية - بيت دير روحي (3 أيام)", info: "مبيت جماعي وأجواء هدوء وتسبحة وقداسات", cost: 20000 },
        { name: "الخلوة السنوية - بيت مؤتمرات متوسط (3 أيام)", info: "غرف مجهزة ومساحات خضراء وقاعة بساوند", cost: 40000 },
        { name: "الخلوة السنوية - منتجع فندقي VIP (3 أيام)", info: "غرف مكيفة وحمام سباحة وملاعب نجيل", cost: 75000 },
        { name: "إعاشة الخلوة - باقة التوفير وساندوتشات", info: "جبن وبقوليات وساندوتشات وعصائر", cost: 10000 },
        { name: "إعاشة الخلوة - وجبات بيتي متوازنة", info: "وجبات مطبوخة دجاج ولحوم وخضار وأرز", cost: 20000 },
        { name: "إعاشة الخلوة - بوفيه مفتوح و Fast Food", info: "بوفيه مفتوح وبرجر وفراخ مشوية وسناكس", cost: 35000 }
      ],
      events: [
        { name: "هدايا أعياد ميلاد الدفعة (شهر فردي - اقتصادي)", info: "نوت بوك أنيق + قلم وميدالية", cost: 1500 },
        { name: "هدايا أعياد ميلاد الدفعة (شهر فردي - فاخر)", info: "هدايا براند مخصصة بالاسم لمواليد الشهر", cost: 3500 },
        { name: "هدايا مناسبة العيد (رمزية)", info: "كارت معايدة وشيكولاتة وإكسسوار", cost: 8000 },
        { name: "هدايا مناسبة العيد (براند وهودي)", info: "هودي شتوي مطبوع + ماج حراري وشنطة", cost: 25000 },
        { name: "مسابقة وتحدي أسبوعي بالقاعة", info: "ألعاب تفاعلية ومسابقات ذكاء داخل الاجتماع", cost: 1000 },
        { name: "مهرجان تيلي ماتش وكرنفال ألعاب الموسم", info: "ألعاب مائية ومسابقات حركية وصوتيات", cost: 15000 }
      ]
    };

    let selectedDesk = "";

    function loginServant() {
      const desk = document.getElementById("deskSelect").value;
      const pass = document.getElementById("servantPassInput").value.trim().toLowerCase();
      const errorEl = document.getElementById("loginError");

      if (!desk || deskPasswords[desk] !== pass) {
        errorEl.style.display = "block";
        return;
      }

      errorEl.style.display = "none";
      selectedDesk = desk;

      const deskTitles = {
        speakers: "🎙️ مكتب المتكلمين (مطلوب 12 أسبوعاً للربع)",
        trips: "🚌 مكتب الرحلات وأتوبيسات الخلوة السنوية",
        events: "🎁 مكتب الهدايا والاحتفالات والأنشطة"
      };

      document.getElementById("deskTitleDisplay").textContent = deskTitles[selectedDesk];
      populateSlotOptions();
      renderMarketGrid();

      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("marketScreen").classList.remove("hidden");
    }

    function populateSlotOptions() {
      const slotSelect = document.getElementById("slotTargetSelect");
      slotSelect.innerHTML = "";

      if (selectedDesk === "speakers") {
        for (let i = 1; i <= 12; i++) {
          const opt = document.createElement("option");
          opt.value = `الأسبوع (${i})`;
          opt.textContent = `📅 الأسبوع رقم ${i}`;
          slotSelect.appendChild(opt);
        }
      } else if (selectedDesk === "trips") {
        slotSelect.innerHTML = `
          <option value="رحلة الشهر (1)">🚌 رحلة الشهر الأول</option>
          <option value="رحلة الشهر (2)">🚌 رحلة الشهر الثاني</option>
          <option value="رحلة الشهر (3)">🚌 رحلة الشهر الثالث</option>
          <option value="الخلوة السنوية الصيفية">☀️ الخلوة السنوية الصيفية</option>
          <option value="إعاشة الخلوة السنوية">🍲 إعاشة الخلوة السنوية</option>
        `;
      } else {
        slotSelect.innerHTML = `
          <option value="مواليد الشهر (1)">🎂 أعياد ميلاد الشهر الأول</option>
          <option value="مواليد الشهر (2)">🎂 أعياد ميلاد الشهر الثاني</option>
          <option value="مواليد الشهر (3)">🎂 أعياد ميلاد الشهر الثالث</option>
          <option value="هدية المناسبة الكبرى">🎄 هدية المناسبة / العيد</option>
          <option value="كرنفال وفعالية الموسم">🎯 كرنفال ومهرجان الموسم</option>
        `;
      }
    }

    function renderMarketGrid() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      marketCatalog[selectedDesk].forEach((item, index) => {
        const box = document.createElement("div");
        box.className = "item-square";

        box.innerHTML = `
          <div>
            <div class="item-title">${item.name}</div>
            <div class="item-info">${item.info}</div>
          </div>
          <div>
            <div class="item-price-tag">${item.cost.toLocaleString()} ج.ك</div>
            <button class="btn-buy" onclick="buyItemDirect(${index})">🛒 اعتماد والشراء</button>
          </div>
        `;

        grid.appendChild(box);
      });
    }

    // شراء مباشر ومؤكد بدون مشاكل الـ Transaction
    function buyItemDirect(itemIndex) {
      const teamSelect = document.getElementById("teamTargetSelect");
      const teamKey = teamSelect.value;
      const teamName = teamSelect.options[teamSelect.selectedIndex]?.text;
      const quarter = document.getElementById("quarterTargetSelect").value;
      const slot = document.getElementById("slotTargetSelect").value;
      const statusEl = document.getElementById("saleStatus");

      statusEl.style.display = "block";

      if (!teamKey) {
        statusEl.style.color = "#ff0844";
        statusEl.textContent = "⚠️ برجاء اختيار الفريق أولاً من الأعلى!";
        return;
      }

      const item = marketCatalog[selectedDesk][itemIndex];
      statusEl.style.color = "#f1c40f";
      statusEl.textContent = "جاري التحقق من الرصيد والخصم...";

      const teamRef = db.ref('teams/' + teamKey);

      teamRef.once('value').then(snapshot => {
        const teamData = snapshot.val() || { balance: 0, plan: { Q1: [], Q2: [], Q3: [], Q4: [] }, purchases: [] };
        const currentBalance = Number(teamData.balance || 0);

        if (currentBalance < item.cost) {
          statusEl.style.color = "#ff0844";
          statusEl.textContent = `❌ رصيد ${teamName} (${currentBalance.toLocaleString()} ج.ك) لا يكفي لشراء [${item.name}] بسعر ${item.cost.toLocaleString()} ج.ك!`;
          return;
        }

        const newBalance = currentBalance - item.cost;
        if (!teamData.plan) teamData.plan = { Q1: [], Q2: [], Q3: [], Q4: [] };
        if (!teamData.plan[quarter]) teamData.plan[quarter] = [];
        
        teamData.plan[quarter].push({
          name: `${slot} : ${item.name}`,
          cost: item.cost,
          desk: selectedDesk,
          slot: slot
        });

        if (!teamData.purchases) teamData.purchases = [];
        teamData.purchases.push({
          item_name: `${item.name} [${slot}]`,
          cost: item.cost,
          quarter: quarter,
          time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        });

        teamData.balance = newBalance;

        teamRef.set(teamData).then(() => {
          statusEl.style.color = "#2ecc71";
          statusEl.textContent = `✅ تم بنجاح شراء [${item.name}] لـ ${teamName} وإضافته في ${slot}! الرصيد المتبقي: ${newBalance.toLocaleString()} ج.ك`;
        }).catch(err => {
          statusEl.style.color = "#ff0844";
          statusEl.textContent = "❌ خطأ أثناء الحفظ: " + err.message;
        });
      });
    }
  </script>
</body>
</html>
