<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصفير نظام الشاركس | Admin Reset</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body {
      background: #060813;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(18, 24, 41, 0.95);
      border: 1.5px solid rgba(255, 8, 68, 0.4);
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 8, 68, 0.15);
    }
    h2 { color: #ff0844; margin-bottom: 12px; font-weight: 900; }
    input[type="password"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 8, 68, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      margin: 15px 0;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #ff0844, #c0392b);
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 8, 68, 0.4);
    }
    button:active { transform: scale(0.97); }
    .status { margin-top: 16px; font-weight: 700; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚠️ تصفير نظام Shark Tank</h2>
    <p style="color: #aaa; font-size: 0.88rem;">أدخل كلمة السر لتصفير محافظ الشاركس وحسابات الفرق بالكامل</p>
    
    <input type="password" id="adminPass" placeholder="كلمة السر...">
    <button onclick="resetSharkSystem()">🔄 تصفير المنظومة بالكامل</button>
    <div class="status" id="statusText"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCuaEafr-MAWy9U85XGN-tyNf-x5cn1JeM",
      authDomain: "maze-d8572.firebaseapp.com",
      databaseURL: "https://maze-d8572-default-rtdb.firebaseio.com",
      projectId: "maze-d8572",
      storageBucket: "maze-d8572.firebasestorage.app",
      messagingSenderId: "133228040813",
      appId: "1:133228040813:web:67eac572b15f952e99e564"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function resetSharkSystem() {
      const pass = document.getElementById("adminPass").value.trim();
      const status = document.getElementById("statusText");

      if (pass !== "avatege2019") {
        status.style.color = "#ff0844";
        status.textContent = "❌ كلمة السر غير صحيحة!";
        return;
      }

      status.style.color = "#f1c40f";
      status.textContent = "جاري تصفير الحسابات والمحافظ...";

      Promise.all([
        db.ref('teams').remove(),
        db.ref('sharks').remove()
      ]).then(() => {
        status.style.color = "#2ecc71";
        status.textContent = "✅ تم تصفير جميع الاستثمارات ومشتريات الفرق بنجاح!";
        document.getElementById("adminPass").value = "";
      }).catch(err => {
        status.style.color = "#ff0844";
        status.textContent = "❌ خطأ أثناء التصفير: " + err.message;
      });
    }
  </script>
</body>
</html>
